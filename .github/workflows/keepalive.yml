name: Free-Tier Keep-Alive Ping

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Services
        run: |
          curl -s -f -m 35 "https://crackit-backend.onrender.com/api/health" || true
          curl -s -f -m 35 "https://crackit-ai-service.onrender.com/health" || true
